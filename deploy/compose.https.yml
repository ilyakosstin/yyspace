services:
  backend:
    environment:
      APP_SESSION_SECURE: "true"
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HTTPS_CERT_DIR:?Set HTTPS_CERT_DIR}:/run/tls:ro
    depends_on:
      - frontend
