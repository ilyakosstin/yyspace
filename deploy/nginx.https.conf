map $http_origin $supplied_origin {
  "" "https://$http_host";
  default $http_origin;
}

map $request_method $write_origin {
  GET "https://$http_host";
  HEAD "https://$http_host";
  OPTIONS "https://$http_host";
  default $supplied_origin;
}

map "$request_method:$uri" $login_limit_key {
  default "";
  "POST:/api/session" $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=focus_login:1m rate=5r/m;

server {
  listen 443 ssl;
  ssl_certificate /run/tls/fullchain.pem;
  ssl_certificate_key /run/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  set $site_origin "https://$http_host";
  if ($write_origin != $site_origin) { return 403; }

  limit_req zone=focus_login burst=6 nodelay;
  limit_req_status 429;
  client_max_body_size 4m;

  resolver 127.0.0.11 valid=10s;
  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
  }
}
